[package]
name = "kvdb"
version = "0.1.0"
edition = "2021"
description = "A persistent LSM-tree key-value store with a Redis-compatible (RESP) server. Zero dependencies."

[lib]
name = "kvdb"
path = "src/lib.rs"

[[bin]]
name = "kvdb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
